# Frosted Glass Dark Lite
# ver. 1.4.0 - (2026-10-01)

Frosted Glass Dark Lite:
  card-mod-theme: 'Frosted Glass Dark Lite'
  uix-theme: 'Frosted Glass Dark Lite'

  # Blazely: view-level styles
  card-mod-view-yaml: |
    "hui-sections-view $": |
      .container {
        padding-top: 12px !important;
      }
    # Skylight calendar card (custom:skylight-calendar-card). It draws its own panel
    # instead of an ha-card, so the card styles never reach it; style it from the
    # section grid it sits in. Covers the week and month layouts.
    "hui-sections-view $ hui-grid-section $": |
      /* Same surface as an ha-card */
      skylight-calendar-card .calendar-container {
        background: var(--ha-card-glass-tint, transparent) !important;
        border: var(--ha-card-border) !important;
        box-shadow: var(--ha-card-box-shadow) !important;
      }
      /* Week: the day grid fills the card (in Firefox it can stop short and
         overflow, showing a scrollbar); no top rule or gaps between days */
      skylight-calendar-card .calendar-container .week-compact-container {
        height: 100% !important;
        max-height: none !important;
        border-top: none !important;
        scrollbar-width: none !important;
        gap: 0 !important;
      }
      /* Month: no top rule or gaps between days */
      skylight-calendar-card .calendar-container .calendar-grid {
        border-top: none !important;
        gap: 0 !important;
      }
      /* No per-day panels; the card surface shows through. (Doubled class: the
         card's own custom-background rule is .calendar-container.custom-background
         ... !important) */
      skylight-calendar-card .calendar-container.calendar-container .week-compact-container > *,
      skylight-calendar-card .calendar-container.calendar-container .week-compact-container > .today,
      skylight-calendar-card .calendar-container.calendar-container .calendar-grid > *,
      skylight-calendar-card .calendar-container.calendar-container .calendar-grid > .today {
        background: transparent !important;
      }
      /* The card draws a right and bottom grid line on every day (::before); along
         the outside they form a grey border. Keep only faint lines between days. */
      skylight-calendar-card .calendar-container .week-compact-container > *::before,
      skylight-calendar-card .calendar-container .calendar-grid > *::before {
        border-right-color: rgba(255, 255, 255, 0.08) !important;
        border-bottom-color: rgba(255, 255, 255, 0.08) !important;
      }
      skylight-calendar-card .calendar-container .week-compact-container > *::before {
        border-bottom: none !important;
      }
      skylight-calendar-card .calendar-container .week-compact-container > :last-child::before,
      skylight-calendar-card .calendar-container .calendar-grid > :nth-child(7n)::before {
        border-right: none !important;
      }
      skylight-calendar-card .calendar-container .calendar-grid > :nth-last-child(-n + 7)::before {
        border-bottom: none !important;
      }
      /* Week: event pills 6px clear of the card edge and the dividers (each
         divider is drawn 1px inside its day's right edge, hence 7px there) */
      skylight-calendar-card .calendar-container .week-day-column {
        padding-left: 6px !important;
        padding-right: 7px !important;
      }
      skylight-calendar-card .calendar-container .week-day-column:last-child {
        padding-right: 6px !important;
      }
      /* Forecast low and high on one line, in time order like the BOM: "7° / 20°".
         The separator belongs to the low, so a day with only a high (today, once
         its overnight low has passed) shows none. */
      skylight-calendar-card .forecast-temperatures {
        display: flex !important;
        flex-direction: row !important;
        align-items: baseline !important;
        gap: 0 !important;
      }
      skylight-calendar-card .forecast-temp-low {
        order: -1;
        opacity: 0.7;
      }
      skylight-calendar-card .forecast-temp-low::after {
        content: ' / ';
        white-space: pre;
        opacity: 0.6;
      }


  # =========================
  # HEADER (Top Bar)
  # =========================
  app-header-backdrop-filter: 'none'
  app-header-background-color: 'transparent'
  app-header-text-color: 'rgba(240, 243, 255, 0.95)'
  app-header-edit-background-color: 'var(--app-header-background-color)'
  app-header-edit-text-color: 'rgba(234, 235, 238, 0.98)'
  app-theme-color: 'rgb(2, 6, 11)'                                                      # 1.2 Glass – header theme color hint for browsers

  # =========================
  # SIDEBAR / DRAWER
  # =========================
  sidebar-background-color: 'rgba(30, 30, 30, 0.8)'   # Blazely: darker sidebar
  sidebar-backdrop-filter: 'none'
  sidebar-border-color: 'rgba(255, 255, 255, 0.12)'
  sidebar-icon-color: 'rgba(234, 235, 238, 0.6)'
  sidebar-text-color: 'rgba(234, 235, 238, 0.8)'
  sidebar-selected-icon-color: 'rgba(234, 235, 238, 0.95)'
  sidebar-selected-text-color: 'rgba(234, 235, 238, 0.98)'

  # =========================
  # DIALOGS
  # =========================
  ha-dialog-surface-backdrop-filter: 'none'
  ha-dialog-surface-background: 'rgb(2, 6, 11)'
  dialog-box-shadow: '0 0 0 0.5px rgba(234, 235, 238, 0.25), 0 24px 64px rgba(0, 0, 0, 0.48), 0 4px 18px rgba(0, 0, 0, 0.28)'   # Blazely: defined edge
  paper-dialog-background-color: 'rgb(2, 6, 11)'
  mdc-dialog-scrim-color: 'var(--frosted-glass-popup-scrim)'

  # =========================
  # THIRD-PARTY CARD CONTRACTS
  # =========================
  bubble-border-radius: '18px'
  bubble-main-background-color: 'transparent'
  bubble-secondary-background-color: 'rgba(255, 255, 255, 0.10)'
  bubble-accent-color: 'rgb(122, 162, 190)'
  bubble-icon-border-radius: '14px'
  bubble-icon-background-color: 'rgba(255, 255, 255, 0.12)'
  bubble-sub-button-border-radius: '12px'
  bubble-sub-button-background-color: 'rgba(255, 255, 255, 0.11)'
  bubble-box-shadow: 'var(--ha-card-box-shadow)'
  bubble-border: '0.5px solid rgba(255, 255, 255, 0.12)'
  bubble-pop-up-border-radius: '28px'
  bubble-pop-up-main-background-color: 'var(--frosted-glass-popup-surface)'
  bubble-pop-up-background-color: 'var(--frosted-glass-popup-surface)'
  bubble-backdrop-background-color: 'rgba(0, 0, 0, 0.62)'
  bubble-backdrop-filter: 'none'
  bubble-select-list-border-radius: '14px'
  bubble-select-list-background-color: 'var(--frosted-glass-menu-surface)'
  bubble-select-list-item-accent-color: 'rgba(122, 162, 190, 0.24)'
  bubble-horizontal-buttons-stack-border-radius: '18px'
  bubble-horizontal-buttons-stack-background-color: 'transparent'
  navbar-background-color: 'transparent'
  navbar-primary-color: 'rgb(122, 162, 190)'
  navbar-border-radius: '18px'
  navbar-box-shadow: 'var(--ha-card-box-shadow)'
  navbar-box-shadow-desktop: 'var(--ha-card-box-shadow)'
  navbar-box-shadow-mobile-floating: 'var(--ha-card-box-shadow)'
  navbar-backdrop-filter: 'none'
  simple-swipe-card-pagination-background: 'transparent'
  simple-swipe-card-pagination-dot-inactive-color: 'rgba(234, 235, 238, 0.34)'
  simple-swipe-card-pagination-dot-active-color: 'rgb(122, 162, 190)'
  simple-swipe-card-pagination-dot-active-box-shadow: '0 0 12px rgba(122, 162, 190, 0.30)'
  btn-bg-color-off: 'rgba(255, 255, 255, 0.09)'
  btn-bg-color-on: 'rgba(122, 162, 190, 0.22)'
  slider-track-color: 'rgba(234, 235, 238, 0.16)'

  # =========================
  # CARDS / CARD-MOD
  # =========================
  # Blazely: -yaml form so shadow-root paths can sit next to "."
  card-mod-card-yaml: |
    ".": |
      /* Keep fixed-position menus in the viewport coordinate system. */
      ha-card {
        background: transparent;

        position: relative;
        isolation: isolate;
      }

      /* Low specificity lets per-card artwork override the glass layer. */
      :where(:host(:not(mushroom-template-card):not(room-summary-card))) ha-card::before {
        content: var(--frosted-glass-card-layer-content, '');
        position: absolute;
        inset: 0;
        background: var(--ha-card-glass-tint);

        z-index: -1;
        pointer-events: none;
        border-radius: inherit;
      }

      /* Containers and text-only cards leave their content's surface intact. */
      :host(hui-heading-card) ha-card,
      :host(.text-only) ha-card,
      ha-card.text-only,
      :host(mushroom-title-card) ha-card,
      :host(mushroom-chips-card) ha-card {
        --ha-card-background: transparent;
        --ha-card-backdrop-filter: none;
        --ha-card-box-shadow: none;
        --frosted-glass-card-layer-content: none;
        background: none !important;

        box-shadow: none !important;
        border: none !important;
      }
      :host(hui-heading-card) ha-card::before,
      :host(.text-only) ha-card::before,
      ha-card.text-only::before,
      :host(mushroom-title-card) ha-card::before,
      :host(mushroom-chips-card) ha-card::before {
        content: none !important;
      }

      /* Bubble owns its rounded surface. Its blur layer cannot trap fixed menus. */
      :host(bubble-card) ha-card,
      :host(.type-custom-bubble-card) ha-card,
      ha-card:has(.bubble-container) {
        background: none !important;

        border-radius: 0 !important;
      }
      :host(bubble-card) ha-card::before,
      :host(.type-custom-bubble-card) ha-card::before,
      ha-card:has(.bubble-container)::before {
        content: none !important;
      }


      :where(:host(bubble-card), :host(.type-custom-bubble-card)) ha-card,
      ha-card:where(:has(.bubble-container)) {
        box-shadow: none;
        border: none;
      }
      .bubble-container {
        background: transparent !important;
        box-shadow: var(--bubble-box-shadow);
      }
      .bubble-background {
        background: transparent !important;
        transition: none;
      }
      .bubble-container::before {
        content: '';
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
      }

      /* Lite also disables Bubble's own inline popup blur defaults. */
      :host(bubble-card) .bubble-pop-up,
      :host(.type-custom-bubble-card) .bubble-pop-up {
        --custom-popup-filter: none !important;
      }

      /* Transparent Hue surfaces need the theme's matching foreground. */
      :host(hue-like-light-card) ha-card,
      :host(.type-custom-hue-like-light-card) ha-card {
        --hue-text-color: var(--primary-text-color);
        background: transparent !important;
        color: var(--primary-text-color) !important;
      }

      /* Navbar resolves its native background against card-background-color.
         Scope the transparent base here; menus elsewhere keep their opaque base.
         Public --navbar-background-color overrides remain owned by the card/user. */
      :host(navbar-card),
      :host(.type-custom-navbar-card) {
        --card-background-color: var(--ha-card-background, transparent);
        --material-shadow-elevation-2dp: var(--ha-card-box-shadow);
      }
      .navbar ha-card,
      :host(navbar-card) ha-card,
      :host(.type-custom-navbar-card) ha-card {
        --frosted-glass-card-layer-content: none;
        box-shadow: var(--navbar-box-shadow-desktop, var(--ha-card-box-shadow));
        background: var(--navbar-background-color, transparent);

        border: var(--ha-card-border);
      }
      :host(navbar-card) .popup-item .button {

        border: var(--ha-card-border);
      }

      :host(:where(slider-button-card, .type-custom-slider-button-card)) {
        --btn-bg-color-off: var(--frosted-glass-slider-button-off);
        --btn-bg-color-on: var(--frosted-glass-slider-button-on);
        --slider-track-color: var(--frosted-glass-slider-track);
      }

      /* Room Summary already paints its own corner reflections. */
      :where(:host(room-summary-card)) ha-card {
        --ha-card-box-shadow: var(--frosted-glass-card-depth-shadow);
      }

      /* Leave both pseudo-elements available for Mushroom template artwork. */
      :host(mushroom-template-card) ha-card {
        background: transparent !important;

      }

      /* stack-in-card writes this inline only when keep.background is false and
         --keep-background is not true. Honor that decision instead of hiding every
         descendant, including those whose background was explicitly kept. */
      ha-card[style*="background: transparent"] {
        --ha-card-backdrop-filter: none;

        border: none;
      }
      ha-card[style*="background: transparent"]::before {
        content: none !important;
      }

      .mdc-data-table {
        background: none !important;
      }
      .mdc-data-table__header-cell {
        background: var(--frosted-glass-control-surface);
      }

      /* === Blazely: camera cards. The card's own edge highlights are an inner
         shadow that the video covers, so draw them, plus a light border, on a
         layer above the video. === */
      :host(.type-custom-advanced-camera-card) ha-card::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        border-radius: inherit;
        box-shadow: var(--ha-card-glass-inset-shadow);
        border: 1px solid rgba(255, 255, 255, 0.25);
      }

      /* === Blazely: the navbar gets the same card surface as other cards (upstream
         turns its tint layer off, and navbar-card sets its own small shadow) === */
      .navbar ha-card,
      :host(navbar-card) ha-card,
      :host(.type-custom-navbar-card) ha-card {
        --frosted-glass-card-layer-content: '';
        box-shadow: var(--ha-card-glass-inset-shadow), 0 0 0 0.5px rgba(234, 235, 238, 0.22), var(--frosted-glass-card-depth-shadow) !important;
      }

      /* === Blazely: Mushroom template cards get the card tint too. Upstream keeps
         their pseudo-elements free for per-card artwork, which we don't use, so
         they showed lighter than every other card. === */
      :host(mushroom-template-card) ha-card::before {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--ha-card-glass-tint);
        z-index: -1;
        pointer-events: none;
        border-radius: inherit;
      }

      /* === Blazely: controls under a card (mode buttons, +/-, toggles) at 36px, the
         same height as the card icons and the controls beside them (HA: 42px) === */
      hui-card-features {
        --feature-height: 36px;
        /* Mode buttons and +/- bars use --disabled-color as their background, which
           upstream tints blue-grey; use the same neutral grey as an off switch.
           Selected and "on" colours come from the entity's state, not this. */
        --disabled-color: rgba(234, 235, 238, 0.8);
        /* A climate's selected "Off" button in the same grey as an off switch's knob
           (it was a bright near-white). Heat, cool etc. keep their own colours. */
        --state-climate-off-color: rgba(234, 235, 238, 0.25);
      }

      /* === Blazely: one "off" look for card icons. Mushroom's named grey (#9e9e9e)
         becomes the same off colour Home Assistant uses for lights. === */
      ha-card {
        --grey-color: rgba(234, 235, 238, 0.8);
      }

      /* === Blazely: active state glow === */
      {% set _entity = config.entity if config.entity is defined else '' %}
      {% set _d = _entity.split('.')[0] if _entity else '' %}
      {% set _s = states[_entity].state if _entity else '' %}
      {% set _active_map = {
        'light':               ['on'],
        'switch':              ['on'],
        'fan':                 ['on'],
        'input_boolean':       ['on'],
        'binary_sensor':       ['on'],
        'automation':          ['on'],
        'script':              ['on'],
        'humidifier':          ['on'],
        'cover':               ['open', 'opening', 'closing'],
        'climate':             ['heat', 'cool', 'heat_cool', 'fan_only', 'dry', 'auto'],
        'alarm_control_panel': ['armed_home', 'armed_away', 'armed_night', 'armed_vacation', 'armed_custom_bypass', 'arming', 'disarming', 'triggered', 'pending'],
        'lock':                ['unlocked', 'locking', 'unlocking'],
        'media_player':        ['playing', 'paused', 'buffering'],
        'vacuum':              ['cleaning', 'returning'],
        'person':              ['not_home'],
        'device_tracker':      ['not_home'],
      } %}
      {% set _motion_map = {
        'cover': ['opening', 'closing'],
        'lock':  ['locking', 'unlocking'],
      } %}
      {% set _active = _d in _active_map and _s in _active_map[_d] %}
      {% set _motion = _d in _motion_map and _s in _motion_map[_d] %}
      @keyframes active-border-pulse {
        0%, 100% { box-shadow: var(--frosted-glass-card-depth-shadow), 0 0 14px 4px rgba(255, 158, 0, 0.35); }
        50%       { box-shadow: var(--frosted-glass-card-depth-shadow), 0 0 6px 1px rgba(255, 158, 0, 0.10); }
      }
      {% if _active %}
      ha-card {
        --ha-card-glass-tint: rgba(255, 140, 0, 0.10);
        --ha-card-border-color: rgba(255, 180, 30, 0.35);
        box-shadow:
          3px 3px 0.5px -3.5px rgba(255, 200, 30, 0.65) inset,
          -2px -2px 0.5px -2px rgba(255, 200, 30, 0.43) inset,
          0 0 6px 1px rgba(255, 160, 30, 0.50) inset,
          0 0 0 1px rgba(255, 180, 30, 0.35),
          var(--frosted-glass-card-depth-shadow),
          0 0 8px 1px rgba(255, 158, 0, 0.18) !important;
        {% if _motion %}animation: active-border-pulse 1.4s ease-in-out infinite;{% endif %}
      }
      {% endif %}

      /* === Blazely: unavailable. Faint diagonal stripes on their own layer, over
         the glass and under the content (a card background would be cleared by
         the Mushroom template card rule above) === */
      {% if _s == 'unavailable' %}
      ha-card::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        border-radius: inherit;
        background: repeating-linear-gradient(135deg, rgba(234, 235, 238, 0.05) 0 6px, transparent 6px 14px);
      }
      {% endif %}

    # Blazely: Home Assistant draws the icon chip only behind icons that are tappable
    # themselves (icon_tap_action). Keep that, and give the other icons a ring in
    # their colour instead, so every icon has the same rounded-square outline. The
    # ring takes the icon's hue at a fixed strength, so a bright sensor icon and a
    # grey "off" icon get the same ring. (The color-mix line is for browsers without
    # relative colours.)
    "ha-tile-icon $": |
      .container:not(.background) {
        box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--tile-icon-color) 60%, transparent);
        box-shadow: inset 0 0 0 2px rgb(from var(--tile-icon-color) r g b / 0.48);
      }
    # Blazely: timer-bar-card (mushroom style) draws its icon with the older Mushroom
    # shape and "disabled" grey (111, 111, 111); use the same off look as other icons.
    "timer-bar-mushroom-row $": |
      mushroom-shape-icon {
        --icon-color-disabled: rgba(234, 235, 238, 0.8) !important;
        --shape-color-disabled: rgba(234, 235, 238, 0.16) !important;
      }
    # Blazely: the toggle feature's switch is greyed when off; when on it keeps Home
    # Assistant's on colour. (Not a template: _active can't see the card's entity
    # at this depth.)
    "hui-card-features $ hui-card-feature $ hui-toggle-card-feature $ ha-control-switch $": |
      div#switch:not([checked]) div.button {
        background-color: rgba(234, 235, 238, 0.25) !important;
      }

  # Global glass tokens are inherited by dialogs, sidebar and custom cards.
  ha-card-glass-tint: 'rgba(28, 29, 33, 0.25)'   # Blazely: a little tint
  ha-tile-icon-border-radius: '12px'   # Blazely: card icons as rounded squares (tile, Mushroom 5), not circles
  mush-icon-border-radius: '12px'      # Blazely: same for older Mushroom shape icons
  ha-card-glass-inset-shadow: '3px 3px 0.5px -3.5px rgba(255, 255, 255, 0.47) inset, -2px -2px 0.5px -2px rgba(255, 255, 255, 0.32) inset, 0 0 8px 1px rgba(255, 255, 255, 0.13) inset, 0 0 2px 0 rgba(0, 0, 0, 0.18)'   # Blazely: stronger corner highlights
  frosted-glass-menu-surface: 'rgb(2, 6, 11)'
  frosted-glass-control-surface: 'rgba(2, 6, 11, 0.48)'
  frosted-glass-badge-shadow: 'var(--ha-card-glass-inset-shadow), 0 3px 10px rgba(0, 0, 0, 0.22)'
  ha-card-backdrop-filter: 'none'
  frosted-glass-slider-button-off: 'var(--btn-bg-color-off)'
  frosted-glass-slider-button-on: 'var(--btn-bg-color-on)'
  frosted-glass-slider-track: 'var(--slider-track-color)'

  card-mod-badge: |
    ha-badge,
    .badge {
      --ha-card-box-shadow: var(--frosted-glass-badge-shadow);
    }

  card-mod-sidebar: |
    :host {
      position: relative;
      isolation: isolate;
      background: transparent;
    }
    :host::before {
      content: '';
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background: var(--sidebar-background-color);
      backdrop-filter: var(--sidebar-backdrop-filter, none);
      -webkit-backdrop-filter: var(--sidebar-backdrop-filter, none);
      box-shadow: inset -1px 0 0 var(--sidebar-border-color);
    }
    .menu {
      background: transparent;
    }

  card-mod-drawer: |
    /* Put the same wallpaper behind the sidebar's glass, including on
       configuration panels. A pseudo-element on the sidebar owns its blur. */
    .sidebar-shell,
    .mdc-drawer {
      background: var(--lovelace-background, var(--background-image));
      border-inline-end: 0.5px solid var(--sidebar-border-color);
    }
    .mdc-drawer__content {
      background: transparent;
    }
    wa-drawer::part(dialog) {
      background: var(--lovelace-background, var(--background-image));
      border-inline-end: 0.5px solid var(--sidebar-border-color);
    }
    :host {
      --mdc-drawer-scrim-color: var(--mdc-dialog-scrim-color);
    }

  # =========================
  # CARD-MOD-ROOT GLOBAL CSS
  # =========================
  card-mod-root: |
    :host {

      /* Glass system tokens (new, dark-tuned) */

      /* Tokens - match structure to Light theme for consistency */
      --token-rgb-primary: 122, 162, 190;
      --token-rgb-black: 0, 0, 0;
      --token-rgb-white: 234, 235, 238;
      --token-rgb-purple: 129, 45, 250;
      --token-rgb-pink: 204, 0, 136;
      --token-rgb-red: 204, 0, 51;
      --token-rgb-deep-purple: 98, 0, 234;
      --token-rgb-indigo: 48, 63, 159;
      --token-rgb-blue: 33, 150, 243;
      --token-rgb-light-blue: 3, 169, 244;
      --token-rgb-cyan: 122, 162, 190;
      --token-rgb-teal: 122, 162, 190;
      --token-rgb-green: 56, 142, 60;
      --token-rgb-light-green: 139, 195, 74;
      --token-rgb-lime: 205, 220, 57;
      --token-rgb-yellow: 250, 183, 0;
      --token-rgb-amber: 255, 193, 7;
      --token-rgb-orange: 255, 158, 0;
      --token-rgb-deep-orange: 255, 87, 34;
      --token-rgb-brown: 121, 85, 72;
      --token-rgb-grey: 101, 117, 130;
      --token-rgb-blue-grey: 96, 125, 139;
      --token-rgb-disabled: 189, 189, 189;
      --token-rgb-state-inactive: 176, 190, 197;

      --token-color-primary: rgb(var(--token-rgb-primary));
      --token-color-primary-light: rgb(172 196 212);
      --token-color-accent: rgb(var(--token-rgb-teal));
      --token-color-disabled: rgb(148 165 178);
      --token-color-feedback-info: rgb(122, 162, 190);
      --token-color-feedback-warning: rgb(255, 219, 117);
      --token-color-feedback-error: rgb(234, 114, 135);
      --token-color-feedback-success: rgb(118, 214, 152);
      --token-color-icon-primary: rgba(234, 235, 238, 0.95);
